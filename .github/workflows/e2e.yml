name: E2E

# Playwright smoke tests (architecture.md §9: "end-to-end deferred until
# there's a UI worth covering" — Sprint 10 built that UI; frontend/e2e/ is
# the resulting suite). Runs the three primary-workflow specs already
# checked in against a real backend (MockProvider, disposable SQLite —
# backend/scripts/run_e2e_backend.sh) and a real Vite dev server, both
# started and torn down by Playwright itself per playwright.config.ts.
# Kept as its own workflow: browser install + two live dev servers make
# this the slowest gate, and it shouldn't block the fast unit-test signal
# in ci.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROVIDER_DEFAULT_PROVIDER: mock
  LANGSMITH_ENABLED: "false"

jobs:
  playwright:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # run_e2e_backend.sh (invoked by playwright.config.ts's webServer)
      # shells out to backend/.venv/bin/{python,uvicorn} directly, so the
      # venv has to exist at that path before Playwright starts its servers
      # — `pip install` alone (no venv) wouldn't satisfy that script.
      - name: Set up backend virtualenv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: frontend
        # --reporter=list,html on top of playwright.config.ts's default
        # 'list' reporter: list keeps readable CI logs, html gives us
        # something to upload as an artifact (the config's default has no
        # file output otherwise).
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
