[project]
name = "ai-test-intelligence-platform-backend"
version = "0.1.0"
description = "Backend service for the AI Test Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "structlog>=24.1,<25.0",
    "anthropic>=0.40,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "prometheus-client>=0.20,<1.0",
    "langsmith>=0.10,<1.0",
    # Sprint 12: RestGitHubClient (integrations/github/client.py) calls the
    # GitHub REST API directly. Was previously a dev-only dependency (pulled
    # in transitively by FastAPI's TestClient); promoted here since app code
    # now imports it too, not just tests.
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.16,<1.0",
    "mypy>=1.11,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Anthropic API; opt-in only, never runs in ordinary pytest/CI",
    "postgres: requires a running Postgres (docker-compose); opt-in only, never runs in ordinary pytest/CI",
]

[tool.ruff]
target-version = "py312"
# 120: matches the width the existing codebase was already hand-formatted
# to (see `ruff format --check` passing clean at this width with zero
# reflow) — this is a description of the existing style, not a new one.
line-length = 120

[tool.ruff.lint]
# A deliberately practical baseline for CI (Sprint 11), not the full rule
# catalog: E/F/W (pyflakes/pycodestyle core), I (import sorting), UP
# (pyupgrade), B (bugbear) minus B008, which flags FastAPI's idiomatic
# `Depends(...)` default-argument pattern used throughout app/api/ — a false
# positive for this framework, not a real bug.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's idiomatic `Depends(...)` default-argument pattern, not a bug
    "E501",  # a handful of pre-existing lines run past 120 in ways that reflow poorly
             # (long docstring-style comments, table-like test assertions); `ruff format`
             # is the source of truth for width, not this rule — see line-length above
    "UP042", # str+Enum (HistoricalPattern) predates this rule; StrEnum has subtly different
             # comparison semantics — a base-class swap is out of scope for a lint-config sprint
    "UP046", # Generic[T] subclassing (BaseRepository) predates PEP 695 type params;
             # same rationale as UP042 — not touched as a side effect of adding CI
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# Practical baseline, not --strict: this is the first typecheck pass this
# codebase has had (Sprint 11). Untyped-def checking and optional handling
# are on; the noisier strict-mode checks (disallow-untyped-decorators,
# warn-return-any, etc.) are deferred rather than mass-suppressed.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# CI's ordinary run excludes live/postgres-marked tests (see markers above),
# so lines only exercised by those opt-in suites would otherwise show as
# uncovered noise on every normal PR.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
