[project]
name = "ai-test-intelligence-platform-backend"
version = "0.1.0"
description = "Backend service for the AI Test Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "structlog>=24.1,<25.0",
    "anthropic>=0.40,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "prometheus-client>=0.20,<1.0",
    "langsmith>=0.10,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Anthropic API; opt-in only, never runs in ordinary pytest/CI",
    "postgres: requires a running Postgres (docker-compose); opt-in only, never runs in ordinary pytest/CI",
]
